name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン (例: 1.2.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Change version in package.json
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ inputs.version }}"/' package.json

      - name: "Commit and push dist/"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git add -f dist/
          git diff --staged --quiet && echo "No changes in package.json or dist/" || \
          git commit -m "Before Release: build dist for v${{ inputs.version }}"
          git push

      - name: Create tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true